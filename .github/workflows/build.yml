name: build

on:
  schedule:
    - cron: "30 23 * * *" # daily at 03:00 Iran time (UTC+3:30); off the hour, which GitHub may delay
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "sources.yaml"
      - "allowlist.txt"
      - "ir-ads.txt"
      - "go.mod"
      - "go.sum"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: write # publish GitHub releases
  pages: write
  id-token: write

env:
  # Identity for the release-branch commit and the keepalive commit. GitHub links
  # a commit to an account by email; this address belongs to no account.
  BOT_NAME: vpn-routing-bot
  BOT_EMAIL: vpn-routing-bot@users.noreply.github.com
  # Pinned tools that compile and validate the sing-box / v2ray outputs.
  # sing-box publishes no checksums; this hash was computed from the release file.
  SING_BOX_VERSION: 1.14.4
  SING_BOX_SHA256: 699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968
  XRAY_VERSION: 26.11.9
  XRAY_SHA256: b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82
  MIHOMO_VERSION: 1.19.34
  MIHOMO_SHA256: 223fab877e5795ce780ba39902e5f0b1113c1256ae244a7160f1165e017e9ccc

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false # never kill a run mid-push

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # HTTP ETag cache + per-source last-known-good. Unique key per run so the
      # cache is saved every time; restore-keys picks the most recent one.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      # Checksums of the latest release: what users download right now.
      - name: Fetch previous checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          gh release download --pattern SHA256SUMS --dir "$RUNNER_TEMP/prev" \
            || echo "No previous checksums; this run publishes a new release."

      - run: go test ./...

      - name: Build
        run: go run ./cmd/build

      - name: Install sing-box, Xray and mihomo
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          echo "${SING_BOX_SHA256}  sb.tgz" | sha256sum -c -
          tar xzf sb.tgz --strip-components=1 -C bin "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
          curl -fsSL -o xr.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          echo "${XRAY_SHA256}  xr.zip" | sha256sum -c -
          unzip -q xr.zip xray -d bin
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
          echo "${MIHOMO_SHA256}  mihomo.gz" | sha256sum -c -
          gunzip -c mihomo.gz > bin/mihomo && chmod +x bin/mihomo
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Validate before publishing, so a broken output never reaches users.
      - name: Compile and check sing-box rule-sets
        run: |
          mkdir -p out/srs
          for f in dist/geo*.json; do
            sing-box rule-set compile --output "out/srs/$(basename "${f%.json}").srs" "$f"
          done
          # "rule-set match" logs "match rules.[N]: ..." to stderr for each matching rule.
          matches() { local out; out=$(sing-box rule-set match -f binary "out/srs/$1.srs" "$2" 2>&1); [[ $out == *"match rules"* ]]; }
          must()    { matches "$1" "$2" || { echo "::error::$1 should match $2"; exit 1; }; }
          mustnot() { ! matches "$1" "$2" || { echo "::error::$1 should not match $2"; exit 1; }; }
          must geosite-ir digikala.com
          must geosite-ir www.digikala.com
          must geosite-ir example.ir
          must geosite-ads yektanet.com
          must geosite-ads cdn.yektanet.com
          must geoip-ir 2.144.0.1
          mustnot geosite-ir google.com
          mustnot geosite-ads digikala.com
          echo '{"outbounds":[{"type":"direct","tag":"direct"},{"type":"direct","tag":"proxy"}]}' > "$RUNNER_TEMP/sb-outbounds.json"
          sing-box check -c "$RUNNER_TEMP/sb-outbounds.json" -c dist/sing-box-route.json

      - name: Check v2ray geo files with Xray
        run: |
          cat > "$RUNNER_TEMP/outbounds.json" <<'JSON'
          { "outbounds": [
              { "tag": "proxy", "protocol": "freedom" },
              { "tag": "direct", "protocol": "freedom" },
              { "tag": "block", "protocol": "blackhole" } ] }
          JSON
          # Fails with "list not found" if a tag referenced by the routing is missing.
          XRAY_LOCATION_ASSET=out xray run -test -c "$RUNNER_TEMP/outbounds.json" -c dist/xray-routing.json

      - name: Compile and check mihomo rule-sets
        run: |
          mkdir -p out/mrs
          for f in out/clash/*.txt; do
            n=$(basename "${f%.txt}")
            case "$n" in geoip-*) b=ipcidr ;; *) b=domain ;; esac
            mihomo convert-ruleset "$b" text "$f" "out/mrs/$n.mrs"
          done
          # Every provider clash.yaml references must exist.
          for t in $(grep -oE 'url: .*/[^/]+\.mrs' dist/clash.yaml | sed -E 's#.*/##'); do
            [ -f "out/mrs/$t" ] || { echo "::error::clash.yaml references missing $t"; exit 1; }
          done
          # Round-trip: decode .mrs back to text and look for known entries.
          dump() { mihomo convert-ruleset "$1" mrs "out/mrs/$2.mrs" "$RUNNER_TEMP/$2.dump"; }
          has()  { dump domain "$1"; grep -qxF -- "$2" "$RUNNER_TEMP/$1.dump" || { echo "::error::$1.mrs should contain $2"; exit 1; }; }
          has geosite-ir "+.ir"
          has geosite-ads "+.yektanet.com"
          # mihomo re-aggregates IP sets, so check containment rather than an exact line.
          dump ipcidr geoip-ir
          python3 -c 'import ipaddress,sys; a=ipaddress.ip_address("2.144.0.1"); sys.exit(0 if any(a in ipaddress.ip_network(l.strip()) for l in open(sys.argv[1]) if l.strip()) else 1)' "$RUNNER_TEMP/geoip-ir.dump" \
            || { echo "::error::geoip-ir.mrs should cover 2.144.0.1"; exit 1; }

      # Everything users download, flat, under the same names the configs reference.
      - name: Assemble release files
        id: assemble
        run: |
          rel="$RUNNER_TEMP/release"
          mkdir -p "$rel"
          cp dist/* out/geosite.dat out/geoip.dat out/srs/*.srs out/mrs/*.mrs "$rel/"
          echo "release files: $(ls "$rel" | wc -l), $(du -sm "$rel" | cut -f1) MB"
          # Outputs are deterministic, so unchanged sources give identical checksums.
          (cd "$rel" && sha256sum -- * | sort -k2) > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" "$rel/SHA256SUMS"
          if cmp -s "$rel/SHA256SUMS" "$RUNNER_TEMP/prev/SHA256SUMS"; then
            echo "No changes since the latest release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "REL=$rel" >> "$GITHUB_ENV"

      # A new release per change: created as a draft, filled, then published, so
      # .../releases/latest/download/<file> switches to the new set at once and
      # never serves a half-uploaded release. Older releases are deleted.
      - name: Publish GitHub release
        if: steps.assemble.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag: sortable UTC build time, e.g. 202611161306 (seconds added on a same-minute
          # clash). Title: the same moment, readable, e.g. "2026-11-16 13:06 UTC".
          now=$(date -u +%s)
          tag=$(date -u -d "@$now" +%Y%m%d%H%M)
          if gh release view "$tag" >/dev/null 2>&1; then tag=$(date -u -d "@$now" +%Y%m%d%H%M%S); fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$(date -u -d "@$now" '+%Y-%m-%d %H:%M UTC')" \
            --notes "- Updated on $(date -u -d "@$now" '+%A %Y-%m-%d %H:%M:%S UTC') from ${GITHUB_SHA::7}
          - Always download from https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/<file> to get latest version."
          gh release upload "$tag" "$REL"/*
          gh release edit "$tag" --draft=false --latest
          # Keep the 7 newest releases (also removes drafts left by failed runs).
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --yes --cleanup-tag || echo "::warning::could not delete release $old"
          done

      # docs/urls.md and docs/sources.md were generated by the build step above.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Build docs
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install -q -r requirements-docs.txt
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and this workflow never commits to main. Push an empty commit
  # when main has been quiet for 50 days.
  keepalive:
    if: always() && github.event_name == 'schedule' # also when the build fails for days
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "$BOT_NAME"
            git config user.email "$BOT_EMAIL"
            git commit --allow-empty -m "chore: keep scheduled workflow enabled"
            git push
          fi
