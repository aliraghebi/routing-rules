name: build

on:
  schedule:
    - cron: "17 2 * * *" # daily, off the hour to avoid the top-of-hour queue
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Allow a list to shrink more than max_shrink (set to 1)"
        default: "0"
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "sources.yaml"
      - "allowlist.txt"
      - "ir-ads.txt"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"

permissions:
  contents: write

# Commit identity for automated commits. GitHub links a commit to an account by
# email; this address belongs to no account, so commits show the plain name.
env:
  BOT_NAME: vpn-routing-bot
  BOT_EMAIL: vpn-routing-bot@users.noreply.github.com
  # Pinned tools that compile and validate the sing-box / v2ray outputs.
  # sing-box publishes no checksums; this hash was computed from the release file.
  SING_BOX_VERSION: 1.14.4
  SING_BOX_SHA256: 699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968
  XRAY_VERSION: 26.11.9
  XRAY_SHA256: b651f7e1d9966ee2c1b1ee1bf8b52c72771824d3065dce96bbc8bcc19ed95f82

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false # never kill a run mid-push

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # HTTP ETag cache + per-source last-known-good. Unique key per run so the
      # cache is saved every time; restore-keys picks the most recent one.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - run: go test ./...

      - name: Build lists
        env:
          ALLOW_SHRINK: ${{ github.event.inputs.allow_shrink || '0' }}
        run: go run ./cmd/build

      - name: Install sing-box and Xray
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSL -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          echo "${SING_BOX_SHA256}  sb.tgz" | sha256sum -c -
          tar xzf sb.tgz --strip-components=1 -C bin "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box"
          curl -fsSL -o xr.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          echo "${XRAY_SHA256}  xr.zip" | sha256sum -c -
          unzip -q xr.zip xray -d bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Validate before committing, so a broken output never reaches dist/ or the release.
      - name: Compile and check sing-box rule-sets
        run: |
          mkdir -p out/srs
          for f in dist/geo*.json; do
            sing-box rule-set compile --output "out/srs/$(basename "${f%.json}").srs" "$f"
          done
          # "rule-set match" prints the matching rule, nothing when there is no match.
          must()    { [ -n "$(sing-box rule-set match -f binary "out/srs/$1.srs" "$2")" ] || { echo "::error::$1 should match $2"; exit 1; }; }
          mustnot() { [ -z "$(sing-box rule-set match -f binary "out/srs/$1.srs" "$2")" ] || { echo "::error::$1 should not match $2"; exit 1; }; }
          must geosite-ir digikala.com
          must geosite-ir www.digikala.com
          must geosite-ir example.ir
          must geosite-ads yektanet.com
          must geosite-ads cdn.yektanet.com
          must geoip-ir 2.144.0.1
          mustnot geosite-ir google.com
          mustnot geosite-ads digikala.com
          echo '{"outbounds":[{"type":"direct","tag":"direct"},{"type":"direct","tag":"proxy"}]}' > "$RUNNER_TEMP/sb-outbounds.json"
          sing-box check -c "$RUNNER_TEMP/sb-outbounds.json" -c dist/sing-box-route.json

      - name: Check v2ray geo files with Xray
        run: |
          cat > "$RUNNER_TEMP/outbounds.json" <<'JSON'
          { "outbounds": [
              { "tag": "proxy", "protocol": "freedom" },
              { "tag": "direct", "protocol": "freedom" },
              { "tag": "block", "protocol": "blackhole" } ] }
          JSON
          # Fails with "list not found" if a tag referenced by the routing is missing.
          XRAY_LOCATION_ASSET=out xray run -test -c "$RUNNER_TEMP/outbounds.json" -c dist/xray-routing.json

      - name: Commit dist/ and docs/
        id: commit
        run: |
          git add dist docs
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --cached --name-only -- dist docs | sed 's#^dist/##')
          if [ "$(echo "$files" | wc -l)" -le 6 ]; then
            lists=$(echo "$files" | paste -sd, - | sed 's/,/, /g')
          else
            lists="$(echo "$files" | wc -l | tr -d ' ') rule files"
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit -m "chore(dist): update ${lists}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Everything users download, flat, under the same names the configs reference.
      - name: Assemble release files
        run: |
          rel="$RUNNER_TEMP/release"
          mkdir -p "$rel"
          cp dist/* out/geosite.dat out/geoip.dat out/srs/*.srs "$rel/"
          size=$(du -sm "$rel" | cut -f1)
          echo "release files: $(ls "$rel" | wc -l), ${size} MB"
          # jsDelivr refuses to serve GitHub packages above its size limit (50 MB at the time of writing).
          if [ "$size" -gt 45 ]; then echo "::warning::release files are ${size} MB, close to jsDelivr's 50 MB package limit"; fi
          echo "REL=$rel" >> "$GITHUB_ENV"

      # The release branch holds exactly one commit with no history (rebuilt and
      # force-pushed each time, like bootmortis/iran-hosted-domains), so binaries
      # never accumulate in the repository. Only the bot pushes it; main is never
      # force-pushed.
      - name: Publish release branch
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "${{ steps.commit.outputs.changed }}" != "true" ] && git ls-remote --exit-code --heads origin release >/dev/null; then
            echo "Nothing changed and the release branch exists."
            exit 0
          fi
          cd "$REL"
          git init -q -b release
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -A
          git commit -qm "release $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          # Purge only files that differ from the previous release (all files on the first run).
          if git fetch -q --depth=1 "$remote" release:previous 2>/dev/null; then
            git diff --name-only previous release > "$RUNNER_TEMP/changed.txt"
          else
            git ls-files > "$RUNNER_TEMP/changed.txt"
          fi
          git push -q -f "$remote" release
          echo "published=true" >> "$GITHUB_OUTPUT"

      # jsDelivr caches branch files for up to 12 hours; purge what changed.
      - name: Purge jsDelivr cache
        if: steps.release.outputs.published == 'true'
        run: |
          while read -r f; do
            curl -fsS -o /dev/null "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${f}" \
              || echo "::warning::jsDelivr purge failed for ${f}"
          done < "$RUNNER_TEMP/changed.txt"

      # Rolling GitHub release with the same files, for .../releases/latest/download/<file>.
      # The "latest" release must stay the newest non-prerelease release.
      - name: Publish rolling GitHub release
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest rule files" \
              --notes "Rebuilt automatically. The same files are on the release branch (GitHub raw and jsDelivr)."
          fi
          gh release upload latest --clobber "$REL"/*

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Daily list changes normally keep the repo active; when sources
  # have been stable for 50 days, push an empty commit to reset the timer.
  keepalive:
    if: always() && github.event_name == 'schedule' # also when build fails for days
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git pull --ff-only
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "$BOT_NAME"
            git config user.email "$BOT_EMAIL"
            git commit --allow-empty -m "chore: keep scheduled workflow enabled"
            git push
          fi
