name: build

on:
  schedule:
    - cron: "17 2 * * *" # daily, off the hour to avoid the top-of-hour queue
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Allow a list to shrink more than max_shrink (set to 1)"
        default: "0"
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "sources.yaml"
      - "allowlist.txt"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false # never kill a run mid-push

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # HTTP ETag cache + per-source last-known-good. Unique key per run so the
      # cache is saved every time; restore-keys picks the most recent one.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - run: go test ./...

      - name: Build lists
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          IP2LOCATION_TOKEN: ${{ secrets.IP2LOCATION_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL }}
          ALLOW_SHRINK: ${{ github.event.inputs.allow_shrink || '0' }}
        run: go run ./cmd/build

      - name: Commit dist/
        id: commit
        run: |
          git add dist
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          lists=$(git diff --cached --name-only -- dist | xargs -n1 basename | paste -sd, - | sed 's/,/, /g')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(dist): update ${lists}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Rolling release so .../releases/latest/download/<file> works. The
      # "latest" release must stay the newest non-prerelease release.
      - name: Publish rolling release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest rule lists" \
              --notes "Rebuilt automatically from sources.yaml. Assets are replaced on every change."
          fi
          gh release upload latest dist/*.list dist/shadowrocket.conf --clobber

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Daily list changes normally keep the repo active; when sources
  # have been stable for 50 days, push an empty commit to reset the timer.
  keepalive:
    if: always() && github.event_name == 'schedule' # also when build fails for days
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git pull --ff-only
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow enabled"
            git push
          fi
