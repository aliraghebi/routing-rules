# Persian (right-to-left) site, built into site/fa. Inherits everything from
# mkdocs.yml and overrides only language, font, paths and navigation.
INHERIT: mkdocs.yml
site_name: قوانین مسیریابی
site_description: "قوانین مسیریابی و پیکربندی‌های آماده برای کلاینت‌های پراکسی و VPN که هر روز به‌روز می‌شوند: اتصال مستقیم برای سایت‌ها و بازه‌های IP داخلی (فعلاً ایران) و مسدودسازی تبلیغات، ردیاب‌ها، بدافزار، فیشینگ و استخراج‌کننده‌های رمزارز."
site_url: https://aliraghebi.github.io/routing-rules/fa/
docs_dir: docs/fa
site_dir: site/fa
edit_uri: edit/main/docs/fa/
copyright: کد تحت مجوز GPL-3.0 · فهرست‌ها مجوز منبع اصلی خود را دارند · مکان‌یابی IP از <a href="https://db-ip.com">DB-IP</a>

theme:
  language: fa
  font:
    text: Vazirmatn
    code: JetBrains Mono

extra_javascript:
  - assets/check-i18n-fa.js
  - assets/check.js

nav:
  - خانه: index.md
  - هسته‌ها:
      - sing-box: sing-box.md
      - Clash / mihomo: clash.md
      - v2ray / Xray: v2ray.md
  - برنامه‌ها:
      - Shadowrocket: shadowrocket.md
      - Surge و Loon: surge-loon.md
      - Karing: karing.md
      - v2rayN / v2rayNG: v2rayn.md
  - بیشتر:
      - WireGuard، OpenVPN و روترها: networks.md
      - مرورگرها (PAC): pac.md
      - AdGuard Home و Pi-hole: dns-filters.md
  - بررسی دامنه: check.md
  - مرجع:
      - نشانی فایل‌ها (انگلیسی): https://aliraghebi.github.io/routing-rules/urls/
      - منابع و مجوزها (انگلیسی): https://aliraghebi.github.io/routing-rules/sources/
