site_name: vpn-routing
site_description: Daily-built routing rules for Iran — Shadowrocket, sing-box, v2ray/Xray
site_url: https://aliraghebi.github.io/vpn-routing/
repo_url: https://github.com/aliraghebi/vpn-routing
repo_name: aliraghebi/vpn-routing
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Guides:
      - Shadowrocket: shadowrocket.md
      - sing-box: sing-box.md
      - v2ray / Xray: v2ray.md
  - Reference:
      - File URLs: urls.md
      - Sources and licenses: sources.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
