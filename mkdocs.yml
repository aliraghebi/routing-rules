site_name: VPN Routing Config Files
site_description: A collection of cross-platform proxy routing rules and configurations. Supports direct routing for Iranian domains and IP ranges, and blocks ads, trackers, phishing, malware, and other malicious traffic across multiple proxy clients.
site_url: https://aliraghebi.github.io/vpn-routing/
repo_url: https://github.com/aliraghebi/vpn-routing
repo_name: aliraghebi/vpn-routing
edit_uri: edit/main/docs/
copyright: Code GPL-3.0 · Lists keep their upstream licenses · IP geolocation by <a href="https://db-ip.com">DB-IP</a>
docs_dir: docs
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - navigation.path
    - content.tooltips
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    admonition:
      note: material/information-outline
      warning: material/alert-outline
      tip: material/lightbulb-on-outline

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aliraghebi/vpn-routing
      name: Source on GitHub
    - icon: material/download
      link: https://github.com/aliraghebi/vpn-routing/releases/latest
      name: Latest release

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Cores:
      - sing-box: sing-box.md
      - Clash / mihomo: clash.md
      - v2ray / Xray: v2ray.md
  - Apps:
      - Shadowrocket: shadowrocket.md
      - Surge & Loon: surge-loon.md
      - Karing: karing.md
      - v2rayN / v2rayNG: v2rayn.md
  - Reference:
      - File URLs: urls.md
      - Sources and licenses: sources.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
